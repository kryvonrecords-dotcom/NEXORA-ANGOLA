    <div id="root">

    <script>
      // Clean up legacy service worker caches if present
      if ('caches' in window) {
        caches.keys().then((keys) => {
          keys.forEach((key) => {
            if (key === 'nexora-news-v1' || key === 'nexora-news-v2') {
              caches.delete(key);
            }
          });
        }).catch(() => {});
      }

      // Register PWA Service Worker safely
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then((reg) => {
              if (reg.update) reg.update();
            })
            .catch(() => {});
        });
      }
    </script>
